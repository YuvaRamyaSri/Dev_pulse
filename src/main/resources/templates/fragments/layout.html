<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: 'DevPulse'">DevPulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #001f3f, #000000);
            color: white;
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 230px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.6);
        }
        .sidebar img { width: 130px; margin-bottom: 10px; filter: drop-shadow(0 0 6px #00c6ff); }
        .sidebar h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }
        .nav-links { width: 100%; display: flex; flex-direction: column; }
        .nav-links a {
            color: #9aa0a6;
            text-decoration: none;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active {
            background: linear-gradient(90deg, #0056b3, #00c6ff);
            color: white;
            box-shadow: 0 0 8px #00c6ff;
        }

        /* MAIN AREA */
        .main-content {
            flex-grow: 1;
            padding: 25px 40px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info i { font-size: 22px; color: #00c6ff; }

        .logout-btn {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(90deg, #0056b3, #0091ff);
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<!-- SIDEBAR -->
<div class="sidebar">
    <img src="/images/devpulse-logo.svg" alt="DevPulse Logo">
    <h2>DevPulse</h2>
    <div class="nav-links">
        <a th:href="@{/home}" th:classappend="${pageTitle}=='Dashboard' ? 'active'"><i class="fa-solid fa-house"></i> Home</a>
        <a th:href="@{/logs}" th:classappend="${pageTitle}=='Daily Logs' ? 'active'"><i class="fa-solid fa-calendar-day"></i> Daily Logs</a>
        <a th:href="@{/summary}" th:classappend="${pageTitle}=='Weekly Summary' ? 'active'"><i class="fa-solid fa-chart-line"></i> Weekly Summary</a>
        <a th:href="@{/insights}" th:classappend="${pageTitle}=='Insights' ? 'active'">
  <i class="fa-solid fa-bolt"></i> Insights</a>
        <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
    </div>
</div>

<!-- MAIN CONTENT AREA (dynamic) -->
<div class="main-content">
    <div class="top-bar">
        <h1 th:text="${topHeading}"></h1>
        <div class="user-info">
            <i class="fa-solid fa-user-circle"></i>
            <a th:href="@{/logout}" class="logout-btn">Logout</a>
        </div>
    </div>

    <!-- Insert child content here -->
    <section layout:fragment="content"></section>
</div>
</body>
</html>
