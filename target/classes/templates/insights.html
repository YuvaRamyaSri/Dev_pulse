<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <meta charset="UTF-8">
    <title>DevPulse | Insights</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #001f3f, #000);
            color: white;
        }

        .insights-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 10px;
        }

        /* ========== PULSE CARD ========== */
        .pulse-card {
            background: linear-gradient(135deg, rgba(0,198,255,0.15), rgba(0,0,0,0.6));
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,198,255,0.3);
        }

        .pulse-ring {
            width: 140px;
            height: 140px;
            margin: 15px auto;
            border-radius: 50%;
            border: 10px solid rgba(255,255,255,0.08);
            position: relative;
            --focus: 7;
        }

        .pulse-ring::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 10px solid #00c6ff;
            clip-path: polygon(50% 50%, 100% 0, 100% 100%);
            transform: rotate(calc(36deg * var(--focus)));
            transition: transform 1.5s ease;
        }

        .pulse-text {
            position: absolute;
            width: 100%;
            top: 40%;
            text-align: center;
            font-size: 22px;
            color: #00c6ff;
        }

        /* ========== METRICS ========== */
        .metrics-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 15px;
        }

        .metric-box {
            flex: 1 1 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,198,255,0.2);
        }

        .metric-box h4 {
            color: #00c6ff;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .metric-box p {
            font-size: 18px;
            font-weight: 600;
        }

        /* ========== INSIGHT CARDS ========== */
        .insight-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        .insight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .insight-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            height: 230px;
            color: white;
            box-shadow: 0 0 20px rgba(0,198,255,0.25);
            transform: scale(0.96);
            opacity: 0;
            transition: all 0.7s ease;
        }

        .insight-card.show {
            transform: scale(1);
            opacity: 1;
        }

        .insight-card img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.55);
            transition: all 0.5s ease;
        }

        .insight-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.3));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 18px;
            box-sizing: border-box;
        }

        .insight-overlay h4 {
            margin: 0 0 8px 0;
            font-size: 17px;
            color: #00c6ff;
            font-weight: 600;
        }

        .insight-overlay p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            color: #f0f0f0;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .insight-card:hover img {
            filter: brightness(0.8) saturate(1.1);
            transform: scale(1.05);
        }

        /* ========== QUOTE ========== */
        .quote-box {
            text-align: center;
            font-style: italic;
            color: #9fdcff;
            margin-top: 25px;
        }

        .quote-box span {
            font-weight: bold;
            color: #00c6ff;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="insights-container">

        <!-- PULSE -->
        <div class="pulse-card">
            <h2>⚡ Your Productivity Pulse</h2>
            <div class="pulse-ring" th:style="'--focus:' + ${averageFocus}">
                <div class="pulse-text" th:text="${averageFocus} + '/10'">7.5/10</div>
            </div>
            <p th:text="'Current Pulse: ' + ${pulseStatus}">Current Pulse: Rising 🔼</p>
        </div>

        <!-- METRICS -->
        <div class="metrics-grid">
            <div class="metric-box"><h4>🔥 Longest Streak</h4><p th:text="${streak} + ' Days'">8 Days</p></div>
            <div class="metric-box"><h4>🧭 Most Focused Day</h4><p th:text="${mostProductiveDay}">Tuesday</p></div>
            <div class="metric-box"><h4>😴 Least Focused Day</h4><p th:text="${leastFocusedDay}">Thursday</p></div>
            <div class="metric-box"><h4>📅 Total Logs</h4><p th:text="${totalLogs}">36</p></div>
        </div>

        <!-- IMAGE INSIGHT CARDS -->
        <div class="insight-section">
            <h3>💬 Deep Insights</h3>
            <div class="insight-grid" id="insightGrid"></div>
        </div>

        <!-- QUOTE -->
        <div class="quote-box">
            <p>"<span>Clarity</span> isn’t found in motion — it’s found in <span>focus</span>."</p>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            const insights = /*[[${habitInsights}]]*/ [];
            const grid = document.getElementById("insightGrid");
            if (!insights || insights.length === 0) {
                grid.innerHTML = "<p>No insights available yet.</p>";
                return;
            }

            const images = [
                "/images/insights/insight1.jpg", // calm ocean sunrise — focus clarity
                "/images/insights/insight2.jpg", // energy sparks — motivation
                "/images/insights/insight3.jpg", // laptop workspace — productivity
                "https://images.unsplash.com/photo-1517694712202-14dd9538aa97", // code screen — developer vibe
                "/images/insights/insight3.jpg", // mountain dawn — persistence
                "/images/insights/insight3.jpg"  // glowing city — ambition
            ];

            grid.innerHTML = "";

            insights.forEach((tip, index) => {
                setTimeout(() => {
                    const div = document.createElement("div");
                    div.className = "insight-card";
                    const img = images[index % images.length];
                    div.innerHTML = `
                        <img src="${img}" alt="Insight Background">
                        <div class="insight-overlay">
                            <h4>Insight ${index + 1}</h4>
                            <p>${tip}</p>
                        </div>
                    `;
                    grid.appendChild(div);
                    setTimeout(() => div.classList.add("show"), 100);
                }, index * 700);
            });
        });
    </script>
</section>
</body>
</html>
