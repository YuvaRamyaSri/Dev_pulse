<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <meta charset="UTF-8">
    <title>DevPulse | Daily Logs</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3>📅 Your Daily Logs</h3>
            <a href="/logs/add" class="add-log">➕ Add New Log</a>
        </div>
        <div class="logs-container" th:if="${!#lists.isEmpty(logs)}">
            <div class="log-card" th:each="log : ${logs}">
                <div class="log-header">
                    <h4 th:text="${log.taskDescription}">Worked on Spring MVC CRUD</h4>
                    <span class="focus-score">🎯 Focus: <span th:text="${log.focusScore}">8</span>/10</span>
                </div>
                <div class="log-body">
                    <p><strong>Date:</strong> <span th:text="${log.logDate}">2025-11-06</span></p>
                    <p><strong>Notes:</strong> <span th:text="${log.notes}">Refactored the controller layer for user management</span></p>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(logs)}" class="no-logs">
            <p>No logs yet 💤 — start by adding your first entry!</p>
        </div>
    </div>

    <style>
        .add-log {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .add-log:hover {
            background: linear-gradient(90deg, #0056b3, #0091ff);
        }

        .logs-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .log-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .log-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 10px;
            padding-bottom: 8px;
        }

        .log-header h4 {
            margin: 0;
            color: #00c6ff;
            font-weight: 600;
        }

        .focus-score {
            font-size: 14px;
            color: #60a5fa;
        }

        .log-body p {
            margin: 5px 0;
            color: #cfd8dc;
        }

        .no-logs {
            text-align: center;
            margin-top: 20px;
            color: #9aa0a6;
        }
    </style>
</section>
</body>
</html>
